name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VELOCITY_TOKEN }}

      - name: Skip if bump commit
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ] && git log -1 --pretty=%B | grep -q "^Bump version"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Go
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: gofmt
        if: steps.check.outputs.skip == 'false'
        run: |
          gofmt -w .
          if ! git diff --quiet; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Files not formatted:"
              git diff --name-only
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-format with gofmt"
          fi

      - name: Test
        if: steps.check.outputs.skip == 'false'
        run: go test ./... -race

      - name: Bump version and changelog
        if: steps.check.outputs.skip == 'false' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: version
        run: |
          CURRENT=$(grep 'var Version' main.go | sed 's/.*"\(.*\)"/\1/')
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s")
          fi

          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)

          HAS_BREAKING=false; HAS_FEAT=false
          ADDED=""; FIXED=""; CHANGED=""

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -qiE "BREAKING|!:"; then HAS_BREAKING=true; fi
            if echo "$msg" | grep -qiE "^feat"; then
              HAS_FEAT=true
              ENTRY=$(echo "$msg" | sed 's/^feat[:(].*[):] *//' | sed 's/^feat: *//')
              ADDED="${ADDED}- ${ENTRY}\n"
            elif echo "$msg" | grep -qiE "^fix"; then
              ENTRY=$(echo "$msg" | sed 's/^fix[:(].*[):] *//' | sed 's/^fix: *//')
              FIXED="${FIXED}- ${ENTRY}\n"
            elif echo "$msg" | grep -qiE "^add"; then
              ENTRY=$(echo "$msg" | sed 's/^add[:(].*[):] *//' | sed 's/^add: *//')
              ADDED="${ADDED}- ${ENTRY}\n"
            else
              if ! echo "$msg" | grep -qiE "^bump|^merge|^Bump|^chore: auto-format"; then
                CHANGED="${CHANGED}- ${msg}\n"
              fi
            fi
          done <<< "$COMMITS"

          if [ "$HAS_BREAKING" = true ]; then MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0
          elif [ "$HAS_FEAT" = true ]; then MINOR=$((MINOR+1)); PATCH=0
          else PATCH=$((PATCH+1)); fi

          NEW="$MAJOR.$MINOR.$PATCH"
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "tag=v$NEW" >> $GITHUB_OUTPUT

          DATE=$(date +%Y-%m-%d)
          CHANGELOG="## [$NEW] - $DATE\n"
          [ -n "$ADDED" ] && CHANGELOG="${CHANGELOG}\n### Added\n${ADDED}"
          [ -n "$FIXED" ] && CHANGELOG="${CHANGELOG}\n### Fixed\n${FIXED}"
          [ -n "$CHANGED" ] && CHANGELOG="${CHANGELOG}\n### Changed\n${CHANGED}"

          echo -e "$CHANGELOG" > /tmp/changelog_entry.txt

          sed -i "s/var Version = \".*\"/var Version = \"$NEW\"/" main.go

          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi

          CHANGELOG_ENTRY=$(cat /tmp/changelog_entry.txt)
          awk -v entry="$CHANGELOG_ENTRY" '
            /^## \[/ && !inserted { print entry; print ""; inserted=1 }
            {print}
          ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add main.go CHANGELOG.md
          git commit -m "Bump version to $NEW"
          git tag "v$NEW"
          git push origin main
          git push origin "v$NEW"

  goreleaser:
    needs: ci
    if: needs.ci.outputs.skip == 'false' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.VELOCITY_TOKEN }}
