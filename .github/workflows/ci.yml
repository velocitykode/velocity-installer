name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/**"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run tests
        run: go test ./... -race

  cicd:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VELOCITY_TOKEN }}

      - name: Check if release needed
        id: check
        run: |
          LAST_MSG=$(git log -1 --pretty=%B)
          if echo "$LAST_MSG" | grep -q "^Bump version"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Go
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # gofmt runs first: auto-format and commit any changes so that the
      # test step (and everything downstream) sees the formatted code.
      - name: gofmt (auto-format)
        if: steps.check.outputs.skip == 'false'
        run: |
          gofmt -w .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-format with gofmt"
          fi

      - name: Run tests
        if: steps.check.outputs.skip == 'false'
        run: go test ./... -race

      - name: Calculate version and changelog
        if: steps.check.outputs.skip == 'false'
        id: version
        run: |
          CURRENT=$(grep 'var Version' main.go | sed 's/.*"\(.*\)"/\1/')
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s")
          fi

          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)

          HAS_BREAKING=false
          HAS_FEAT=false
          ADDED=""
          FIXED=""
          CHANGED=""

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -qiE "BREAKING|!:"; then
              HAS_BREAKING=true
            fi
            if echo "$msg" | grep -qiE "^feat"; then
              HAS_FEAT=true
              ENTRY=$(echo "$msg" | sed 's/^feat[:(].*[):] *//' | sed 's/^feat: *//')
              ADDED="${ADDED}- ${ENTRY}\n"
            elif echo "$msg" | grep -qiE "^fix"; then
              ENTRY=$(echo "$msg" | sed 's/^fix[:(].*[):] *//' | sed 's/^fix: *//')
              FIXED="${FIXED}- ${ENTRY}\n"
            elif echo "$msg" | grep -qiE "^add"; then
              ENTRY=$(echo "$msg" | sed 's/^add[:(].*[):] *//' | sed 's/^add: *//')
              ADDED="${ADDED}- ${ENTRY}\n"
            else
              if ! echo "$msg" | grep -qiE "^bump|^merge|^Bump|^chore: auto-format"; then
                CHANGED="${CHANGED}- ${msg}\n"
              fi
            fi
          done <<< "$COMMITS"

          if [ "$HAS_BREAKING" = true ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$HAS_FEAT" = true ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW="$MAJOR.$MINOR.$PATCH"
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "tag=v$NEW" >> $GITHUB_OUTPUT

          DATE=$(date +%Y-%m-%d)
          CHANGELOG="## [$NEW] - $DATE\n"
          [ -n "$ADDED" ] && CHANGELOG="${CHANGELOG}\n### Added\n${ADDED}"
          [ -n "$FIXED" ] && CHANGELOG="${CHANGELOG}\n### Fixed\n${FIXED}"
          [ -n "$CHANGED" ] && CHANGELOG="${CHANGELOG}\n### Changed\n${CHANGED}"

          echo -e "$CHANGELOG" > /tmp/changelog_entry.txt
          echo "Bumping: $CURRENT -> $NEW"

      - name: Update version and changelog
        if: steps.check.outputs.skip == 'false'
        run: |
          NEW_VERSION=${{ steps.version.outputs.new }}
          sed -i "s/var Version = \".*\"/var Version = \"$NEW_VERSION\"/" main.go

          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi

          CHANGELOG_ENTRY=$(cat /tmp/changelog_entry.txt)
          awk -v entry="$CHANGELOG_ENTRY" '
            /^## \[/ && !inserted { print entry; print ""; inserted=1 }
            {print}
          ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit, tag, and push
        if: steps.check.outputs.skip == 'false'
        run: |
          NEW_VERSION=${{ steps.version.outputs.new }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add main.go CHANGELOG.md
          git commit -m "Bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin main
          git push origin "v$NEW_VERSION"

  goreleaser:
    needs: cicd
    if: needs.cicd.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.cicd.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.VELOCITY_TOKEN }}
