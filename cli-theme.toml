# velocity-cli theme config for the Velocity installer.
# Loaded at startup by main.go via cli.LoadConfig. Edit freely —
# missing fields fall back to SDK defaults.
#
# Palette: Velocity brand greens + warm accents, chosen to read on
# both dark and light terminal backgrounds.

[colors]
primary = "#16a34a"  # emerald-600 — Velocity brand green
success = "#10b981"  # emerald-500 — brighter, used for confirmations
warning = "#d97706"  # amber-600 — legible on white
error   = "#dc2626"  # red-600
muted   = "#71717a"  # zinc-500

[symbols]
arrow = "→"
check = "✓"
warn  = "!"
cross = "✗"
