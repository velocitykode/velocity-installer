version: 2

builds:
  - id: velocity
    main: .
    binary: velocity
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: velocity
    ids:
      - velocity
    name_template: "velocity-{{ .Os }}-{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: velocity
    repository:
      owner: velocitykode
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    binaries:
      - velocity
    homepage: "https://github.com/velocitykode/velocity-installer"
    description: "Installer for the Velocity Go web framework"
    url:
      verified: "github.com/velocitykode/velocity-installer/"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/velocity"]
          end
